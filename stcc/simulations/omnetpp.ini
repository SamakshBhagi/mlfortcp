[General]
network = stcc.simulations.Dumbbell
cmdenv-express-mode = true
cmdenv-status-frequency = 1000s
cmdenv-redirect-output = false
**.cmdenv-log-level = off
record-eventlog = false
sim-time-limit = 20s

# recording is switched on per run by the episode file when needed
**.scalar-recording = false
**.vector-recording = false
**.statistic-recording = false

*.configurator.dumpRoutes = false
*.configurator.addStaticRoutes = true

# bottleneck queue (r1 -> r2 is ppp[0] on r1); others effectively unbounded
**.ppp[*].queue.typename = "DropTailQueue"
**.ppp[*].queue.packetCapacity = 10000
*.r1.ppp[0].queue.packetCapacity = 100

# ---------------- TCP -----------------------------------------------------
**.tcp.typename = "Tcp"
**.tcp.advertisedWindow = 16777215
**.tcp.windowScalingSupport = true
**.tcp.timestampSupport = false
**.tcp.sackSupport = true
**.tcp.delayedAcksEnabled = false
**.tcp.nagleEnabled = true
**.tcp.limitedTransmitEnabled = false
**.tcp.increasedIWEnabled = true
**.tcp.mss = 1448
**.tcp.initialSsthresh = 4294967295
**.tcp.tcpAlgorithmClass = "TcpNewReno"

# senders: one long-running bulk transfer each; start/stop per episode file
**.sender[*].numApps = 1
**.sender[*].app[0].typename = "TcpSessionApp"
**.sender[*].app[0].active = true
**.sender[*].app[0].localPort = 10000 + parentIndex()
**.sender[*].app[0].connectAddress = "receiver[" + string(parentIndex()) + "]"
**.sender[*].app[0].connectPort = 20000
**.sender[*].app[0].sendBytes = 1500MiB
**.sender[*].app[0].tOpen = 0.1s
**.sender[*].app[0].tSend = 0.1s
**.sender[*].app[0].tClose = -1s

**.receiver[*].numApps = 1
**.receiver[*].app[0].typename = "TcpSinkApp"
**.receiver[*].app[0].localPort = 20000

# UDP cross traffic (Poisson); disabled unless the episode file enables it
*.udpSrc.numApps = 1
*.udpSrc.app[0].typename = "UdpBasicApp"
*.udpSrc.app[0].destAddresses = "udpSink"
*.udpSrc.app[0].destPort = 30000
*.udpSrc.app[0].messageLength = 1200B
*.udpSrc.app[0].startTime = 1000s
*.udpSrc.app[0].sendInterval = exponential(1ms)
*.udpSink.numApps = 1
*.udpSink.app[0].typename = "UdpSink"
*.udpSink.app[0].localPort = 30000

*.scenarioManager.script = xml("<scenario/>")
